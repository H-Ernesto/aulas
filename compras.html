<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lojinha do Herói</title>
</head>
<body>

  <h2>Carrinho de Compras - Loja de Itens</h2>

  <!-- O border="1" ajuda os alunos a visualizarem as grades da tabela -->
  <table border="1" width="300">
    <tr>
      <th>Item</th>
      <th>Quantidade</th>
      <th>Valor</th>
    </tr>
    <tr>
      <td>Poção de Cura</td>
      <td>2</td>
      <td>10 moedas</td>
    </tr>
    <tr>
      <td>Espada Épica</td>
      <td>1</td>
      <td>50 moedas</td>
    </tr>
    
    <!-- Aqui acontece a mágica do colspan! -->
    <tr>
      <th colspan="2">TOTAL DA COMPRA</th>
      <td>60 moedas</td>
    </tr>
  </table>

</body>
</html>
